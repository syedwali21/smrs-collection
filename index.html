<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SMR'S COLLECTION</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#0b0b0b;
  color:white;
}

header{
  background:#000;
  padding:18px 7%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  position:sticky;
  top:0;
  z-index:10;
  border-bottom:1px solid #222;
}

.logo{
  font-size:27px;
  font-weight:bold;
  letter-spacing:2px;
}

nav a{
  color:white;
  text-decoration:none;
  margin-left:20px;
  font-size:14px;
}

.hero{
  min-height:75vh;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:40px 20px;
  background:
  linear-gradient(rgba(0,0,0,.45),rgba(0,0,0,.65)),
  url('banner.jpg') center/cover no-repeat;
}

.hero h1{
  font-size:55px;
  letter-spacing:4px;
  margin-bottom:15px;
}

.hero p{
  color:#ddd;
  font-size:18px;
  margin-bottom:25px;
}

.btn{
  display:inline-block;
  background:white;
  color:black;
  padding:13px 25px;
  border-radius:5px;
  text-decoration:none;
  font-weight:bold;
}

section{
  padding:55px 7%;
}

.title{
  text-align:center;
  font-size:30px;
  margin-bottom:35px;
}

.categories{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:22px;
}

.category{
  background:#151515;
  border:1px solid #292929;
  border-radius:10px;
  padding:30px 20px;
  text-align:center;
}

.category h3{
  font-size:21px;
  margin-bottom:10px;
}

.category p{
  color:#999;
  font-size:13px;
}

.category a{
  display:inline-block;
  margin-top:18px;
  background:white;
  color:black;
  padding:10px 18px;
  border-radius:5px;
  text-decoration:none;
  font-weight:bold;
  font-size:13px;
}

.products{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
  gap:22px;
}

.card{
  background:#151515;
  border:1px solid #292929;
  border-radius:10px;
  overflow:hidden;
}

.product-image{
  width:100%;
  height:300px;
  background:#111;
  display:flex;
  align-items:center;
  justify-content:center;
}

.product-image img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.info{
  padding:18px;
}

.info h3{
  margin-bottom:15px;
  font-size:20px;
}

select{
  width:100%;
  padding:11px;
  margin-bottom:10px;
  background:#222;
  color:white;
  border:1px solid #444;
  border-radius:5px;
}

.price{
  color:#ccc;
  margin:8px 0 15px;
}
